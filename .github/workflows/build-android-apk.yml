name: Build Akashvani Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes"
        required: false
        default: "Automated Android APK build of Akashvani Malayalam Live Radio."

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Upload ZIP to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install Android 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using preinstalled sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure permanent release signing keystore (enables in-place updates)
        run: |
          KEYSTORE_PATH="android/app/akashvani-release.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring signing keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using permanent committed signing keystore at $KEYSTORE_PATH (same signature -> in-place updates work!)"
          else
            echo "Keystore missing; generating fallback keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass akashvani2026 \
              -keypass akashvani2026 \
              -alias akashvani \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Akashvani Malayalam Radio, OU=Broadcast, O=Akashvani, L=Kochi, ST=Kerala, C=IN"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Inject repository stations.json URL for remote updates
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/stations.json"
          echo "REMOTE_STATIONS_URL=${RAW_URL}" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          AKASHVANI_STORE_FILE: akashvani-release.jks
          AKASHVANI_STORE_PASSWORD: akashvani2026
          AKASHVANI_KEY_ALIAS: akashvani
          AKASHVANI_KEY_PASSWORD: akashvani2026
        run: |
          gradle assembleRelease --no-daemon \
            -PremoteStationsUrl="${REMOTE_STATIONS_URL}" \
            -PgithubRepo="${{ github.repository }}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="1.0.${{ github.run_number }}"

      - name: Package APK into ZIP archive
        run: |
          mkdir -p release-dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Akashvani-v1.0.${{ github.run_number }}.apk"
          ZIP_NAME="Akashvani-v1.0.${{ github.run_number }}-android-apk.zip"

          cp "$APK_SRC" "release-dist/$APK_NAME"

          printf '%s\n' \
            'Akashvani — Live Malayalam Radio (Android APK)' \
            '==============================================' \
            '1. Unzip this file on your Android phone (Files app -> Extract).' \
            "2. Tap $APK_NAME to install or update." \
            '3. Signed with a permanent key: future versions will simply show "Update" (no uninstall needed!).' \
            '4. If Android asks for permission to install from your browser/Files app, tap Allow once.' \
            '5. Open Akashvani, tap the huge Play button, and enjoy live Malayalam radio!' \
            > release-dist/HOW-TO-INSTALL.txt

          (cd release-dist && zip -9 "$ZIP_NAME" "$APK_NAME" "HOW-TO-INSTALL.txt")
          ls -lh "release-dist/$ZIP_NAME"

      - name: Publish ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Akashvani v1.0.${{ github.run_number }}"
          body: |
            ### Akashvani — Native Android App (Malayalam Live Radio)
            ${{ inputs.release_notes || 'Built automatically via GitHub Actions.' }}

            **Included in this ZIP:**
            - `Akashvani-v1.0.${{ github.run_number }}.apk` (permanently signed for in-place updates on Android 7.0+)
            - Exact offline & stream-failure diagnosis, automatic backup link switching, and auto-resume when internet returns
            - Locked normal font scaling (unaffected by large system fonts), Akashvani Kerala default #1, and all Kerala FM stations
            - Automatic remote station list sync from `stations.json` & in-app update alerts
          files: |
            release-dist/Akashvani-v1.0.${{ github.run_number }}-android-apk.zip
          draft: false
          prerelease: false
